---
- name: Deploy Paintings Hall with Docker Compose
  hosts: paintings_servers
  become: yes
  vars_files:
    - vars.yml

  tasks:
    - name: Install required system packages
      ansible.builtin.package:
        name:
          - docker.io
          - python3-pip
        state: present

    - name: Start and enable Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: yes

    - name: Install Docker SDK for Python
      ansible.builtin.pip:
        name: docker
        state: present

    - name: Create project directory
      ansible.builtin.file:
        path: "{{ project_dir }}"
        state: directory
        mode: '0755'

    - name: Copy project files to target host
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ project_dir }}/{{ item }}"
      loop:
        - Dockerfile
        - docker-compose.yml
        - src
        - init-db

    - name: Build and start services with Docker Compose
      ansible.builtin.command: docker compose up --build -d
      args:
        chdir: "{{ project_dir }}"
      register: compose_result
      changed_when: compose_result.rc == 0

    - name: Wait for application to be ready
      ansible.builtin.uri:
        url: "http://localhost:{{ app_port }}"
        status_code: 200
        return_content: yes
      register: app_health
      until: app_health.status == 200
      retries: 30
      delay: 5

    - name: Verify Paintings API returns success
      ansible.builtin.uri:
        url: "http://localhost:{{ app_port }}/paintings.php"
        status_code: 200
        return_content: yes
      register: api_check
      until: "'success' in api_check.content"
      retries: 10
      delay: 5
