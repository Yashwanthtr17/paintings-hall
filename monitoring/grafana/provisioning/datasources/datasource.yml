apiVersion: 1

datasources:
  - name: PostgreSQL
    uid: paintings-postgres
    type: postgres
    access: proxy
    url: ${DB_HOST}:${DB_PORT}
    user: ${DB_USER}
    database: ${DB_NAME}
    isDefault: true
    editable: true
    secureJsonData:
      password: ${DB_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1500
